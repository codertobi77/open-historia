<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H9EQ4JFZXZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-H9EQ4JFZXZ');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable — Open Historia</title>
    <!-- Same compass favicon as the landing page (assemble-site copies site/ to the
         root, so /favicon.png resolves here too). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e9dcc0" />

    <!-- French counterpart of /404.html. The host serves /404.html with a 404
         status when a path matches no asset; this page keeps the same identity
         for French-speaking visitors who land on /fr/404.html directly. -->
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    />

    <style>
      :root {
        --parch: #e9dcc0;
        --ink: #2c2216;
        --sepia: #6c5a3c;
        --line: rgba(74, 54, 24, 0.18);
        --line2: rgba(74, 54, 24, 0.3);
        --bronze: #9a6b2f;
        --gold: #b8860b;
        --marble: #f6efdc;
        --grad-gold: linear-gradient(100deg, #7c4f18 0%, #b8860b 52%, #8f6a22 100%);
        --serif: "EB Garamond", Georgia, "Times New Roman", serif;
        --display: "Cinzel", Georgia, "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 18px;
        line-height: 1.62;
        text-align: center;
        background:
          radial-gradient(1200px 540px at 50% -12%, rgba(184, 134, 11, 0.12), transparent 60%),
          repeating-linear-gradient(112deg, rgba(120, 90, 40, 0.028) 0 2px, transparent 2px 7px),
          var(--parch);
      }
      .wrap { max-width: 560px; }
      .mark { font-size: 3rem; line-height: 1; margin-bottom: 12px; }
      h1 {
        font-family: var(--display);
        font-size: clamp(2.2rem, 8vw, 3.4rem);
        margin: 0 0 6px;
        letter-spacing: 0.02em;
      }
      .eyebrow {
        font-family: var(--display);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.78rem;
        color: var(--sepia);
        margin-bottom: 18px;
      }
      p { color: var(--sepia); margin: 0 auto 26px; }
      .rule {
        width: 90px;
        height: 1px;
        margin: 22px auto;
        background: linear-gradient(90deg, transparent, var(--line2), transparent);
      }
      .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn {
        font-family: var(--display);
        font-size: 0.95rem;
        text-decoration: none;
        padding: 0.7rem 1.2rem;
        border-radius: 12px;
        border: 1px solid var(--line2);
        color: var(--ink);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -14px rgba(60, 40, 14, 0.7); }
      .btn-primary {
        background: linear-gradient(100deg, #7c4f18 0%, var(--gold) 52%, #8f6a22 100%);
        color: #fff8e6;
        border-color: var(--bronze);
      }
      /* Language switcher — parchment theme, matches the landing page. */
      .lang-switcher {
        position: fixed;
        top: 14px;
        right: 16px;
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--marble);
        border: 1px solid var(--line2);
        border-radius: 8px;
      }
      .lang-switcher a {
        font-family: var(--display);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 5px 11px;
        border-radius: 6px;
        color: var(--sepia);
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
      }
      .lang-switcher a:hover { color: var(--ink); }
      .lang-switcher a.active { background: var(--grad-gold); color: #fbf3dc; }
    </style>
  </head>
  <body>
    <nav class="lang-switcher" aria-label="Langue">
      <a href="/404.html">EN</a>
      <a href="/fr/404.html" class="active" aria-current="page">FR</a>
    </nav>

    <main class="wrap">
      <div class="mark">🏛️</div>
      <div class="eyebrow">Erreur 404</div>
      <h1>Perdue dans l'histoire</h1>
      <div class="rule"></div>
      <p>
        Cette page n'existe pas — ou elle a existé un jour, et les frontières ont bougé depuis.
        Vérifiez l'adresse, ou repartez d'un endroit sûr.
      </p>
      <div class="btns">
        <a class="btn btn-primary" href="/fr/">Retour à l'accueil</a>
        <a class="btn" href="/play/">Jouer</a>
        <a class="btn" href="/fr/guides/">Guides</a>
      </div>
    </main>
  </body>
</html>
